<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your Smart Attendance System account" />
  <title>Create Account · Smart Attendance System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#eff6ff", 100: "#dbeafe", 200: "#bfdbfe", 300: "#93c5fd", 400: "#60a5fa", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8", 800: "#1e40af", 900: "#1e3a8a" },
            accent: { 50: "#faf5ff", 100: "#f3e8ff", 200: "#e9d5ff", 300: "#d8b4fe", 400: "#c084fc", 500: "#a855f7", 600: "#9333ea", 700: "#7e22ce" },
            gray: { 25: "#fcfcfd", 50: "#f9fafb", 100: "#f3f4f6", 200: "#e5e7eb", 300: "#d1d5db", 400: "#9ca3af", 500: "#6b7280", 600: "#4b5563", 700: "#374151", 800: "#1f2937", 900: "#111827" },
          },
          boxShadow: {
            soft: "0 2px 8px 0 rgba(0,0,0,0.05)",
            "soft-md": "0 4px 12px 0 rgba(0,0,0,0.07)",
            "soft-lg": "0 10px 30px -5px rgba(0,0,0,0.10)",
            "soft-xl": "0 20px 40px -10px rgba(0,0,0,0.12)",
            brand: "0 4px 12px -2px rgba(59,130,246,0.15)",
            "brand-lg": "0 10px 30px -5px rgba(59,130,246,0.20)",
            "inner-soft": "inset 0 2px 4px 0 rgba(0,0,0,0.05)"
          },
          animation: {
            "fade-in": "fadeIn 0.5s ease-out",
            "slide-up": "slideUp 0.5s ease-out",
            "pulse-gentle": "pulseGentle 3s cubic-bezier(0.4,0,0.6,1) infinite",
            shimmer: "shimmer 2s linear infinite",
          },
          keyframes: {
            fadeIn: { "0%": { opacity: 0 }, "100%": { opacity: 1 } },
            slideUp: { "0%": { transform: "translateY(20px)", opacity: 0 }, "100%": { transform: "translateY(0)", opacity: 1 } },
            pulseGentle: { "0%,100%": { opacity: 0.6 }, "50%": { opacity: 0.8 } },
            shimmer: { "0%": { backgroundPosition: "-1000px 0" }, "100%": { backgroundPosition: "1000px 0" } },
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .gradient-light {
      background: linear-gradient(135deg, #ffffff 0%, #f9fafb 50%, #eff6ff 100%);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }

    .spinner {
      border: 2px solid rgba(59, 130, 246, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin .6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .6), transparent);
      background-size: 1000px 100%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>

<body class="min-h-screen gradient-light flex items-center justify-center p-4 overflow-x-hidden">
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-100/60 rounded-full blur-3xl animate-pulse-gentle"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-accent-100/60 rounded-full blur-3xl animate-pulse-gentle"
      style="animation-delay:1.5s"></div>
    <div
      class="absolute top-12 left-12 -translate-x-12 -translate-y-12 w-[600px] h-[600px] bg-gradient-to-br from-brand-50/80 to-accent-50/80 rounded-full blur-3xl">
    </div>
  </div>

  <div class="relative w-full max-w-2xl animate-slide-up">
    <div class="bg-white/85 backdrop-blur-xl border border-gray-200 rounded-[32px] shadow-soft-xl overflow-hidden">
      <div class="p-8 pb-6">
        <div class="flex items-start gap-4 mb-8">
          <div class="relative flex-shrink-0 group">
            <div
              class="absolute inset-0 bg-gradient-to-br from-brand-500 to-accent-500 rounded-2xl blur-sm opacity-30 group-hover:opacity-50 transition-opacity duration-300">
            </div>
            <div
              class="relative w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-accent-500 flex items-center justify-center shadow-brand transform group-hover:scale-105 transition-transform duration-300">
              <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <p id="roleBadge"
              class="inline-flex items-center gap-2 px-3 py-1 text-xs font-semibold rounded-full bg-brand-50 text-brand-700 uppercase tracking-wide">Invite
              signup</p>
            <h1 id="pageTitle" class="text-2xl font-bold text-gray-900 mb-1 tracking-tight">Create an account</h1>
            <p id="pageDescription" class="text-sm text-gray-600 leading-relaxed">Please use the invite link sent to you
              to continue.</p>
          </div>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-xl border animate-fade-in" role="alert" aria-live="assertive">
          <div class="flex items-start gap-3">
            <svg id="alertIcon" class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor"
              viewBox="0 0 24 24" aria-hidden="true"></svg>
            <span id="alertText" class="text-sm font-medium flex-1"></span>
          </div>
        </div>

        <form id="signupForm" class="space-y-5" novalidate>
          <div class="space-y-2">
            <label for="fullname" class="block text-sm font-semibold text-gray-700">Full name</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 14l9-5-9-5-9 5 9 5zm0 0v6" />
                </svg>
              </div>
              <input type="text" id="fullname" name="fullname" required autocomplete="name" aria-required="true"
                aria-invalid="false" aria-describedby="fullname-error"
                class="w-full pl-12 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 hover:border-gray-300 shadow-soft"
                placeholder="e.g. Jane Doe" />
            </div>
            <p id="fullname-error" class="hidden text-xs text-red-600 mt-1.5 ml-1" role="alert"></p>
          </div>

          <div class="space-y-2">
            <label for="userid" class="block text-sm font-semibold text-gray-700">Username</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <input type="text" id="userid" name="userid" required autocomplete="username" aria-required="true"
                aria-invalid="false" aria-describedby="userid-error"
                class="w-full pl-12 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 hover:border-gray-300 shadow-soft"
                placeholder="e.g. jdoe123" />
            </div>
            <p id="userid-error" class="hidden text-xs text-red-600 mt-1.5 ml-1" role="alert"></p>
          </div>

          <div class="space-y-2">
            <label for="email" class="block text-sm font-semibold text-gray-700">Email address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </div>
              <input type="email" id="email" name="email" required autocomplete="email" aria-invalid="false"
                aria-describedby="email-error"
                class="w-full pl-12 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 hover:border-gray-300 shadow-soft"
                placeholder="e.g. jane.doe@school.edu" />
            </div>
            <p id="email-error" class="hidden text-xs text-red-600 mt-1.5 ml-1" role="alert"></p>
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">Role</label>
            <div id="roleDisplay"
              class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 shadow-inner-soft">
              Pending invite…
            </div>
            <p class="text-xs text-gray-500 ml-1">Role is determined by the invite link you used.</p>
          </div>

          <div class="space-y-2">
            <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2M6 21h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input type="password" id="password" name="password" required autocomplete="new-password"
                aria-required="true" aria-invalid="false" aria-describedby="password-error"
                class="w-full pl-12 pr-12 py-3.5 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 hover:border-gray-300 shadow-soft"
                placeholder="Create a password" />
              <button type="button" id="togglePassword" aria-label="Toggle password visibility"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-50 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
            <p id="password-error" class="hidden text-xs text-red-600 mt-1.5 ml-1" role="alert"></p>
          </div>

          <div class="space-y-2">
            <label for="inviteCode" class="block text-sm font-semibold text-gray-700">Invite code</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8c-1.66 0-3 1.57-3 3.5S10.34 15 12 15s3-1.57 3-3.5S13.66 8 12 8z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5.697 4.697A1 1 0 006 4h12a1 1 0 01.894.553l1.5 3A1 1 0 0120.5 9h-17a1 1 0 01-.894-1.447l1.5-3z" />
                </svg>
              </div>
              <input type="text" id="inviteCode" name="inviteCode" required autocomplete="off"
                aria-required="true" aria-invalid="false" aria-describedby="inviteCode-error"
                class="w-full pl-12 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 hover:border-gray-300 shadow-soft"
                placeholder="Paste the invite code provided to you" />
            </div>
            <p id="inviteCode-error" class="hidden text-xs text-red-600 mt-1.5 ml-1" role="alert"></p>
          </div>

          <button type="submit" id="submitBtn"
            class="group relative w-full py-3.5 px-4 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold rounded-xl shadow-brand transition-all duration-200 transform hover:scale-[1.02] hover:shadow-brand-lg active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none overflow-hidden">
            <div class="absolute inset-0 shimmer animate-shimmer opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <span class="relative flex items-center justify-center gap-2">
              <span id="btnText">Create account</span>
              <svg id="btnArrow" class="w-5 h-5 transform group-hover:translate-x-1 transition-transform duration-200"
                fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
              </svg>
              <div id="btnSpinner" class="hidden spinner"></div>
            </span>
          </button>
        </form>
      </div>

      <div class="px-8 py-6 bg-gray-50/50 border-t border-gray-100">
        <p class="text-sm text-center text-gray-600">
          Already have an account?
          <a href="index.html"
            class="text-brand-600 hover:text-brand-700 font-semibold transition-colors duration-200 focus:outline-none focus:underline">Sign
            in</a>
        </p>
      </div>

      <div
        class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-transparent via-brand-400/30 to-transparent rounded-full blur-sm">
      </div>
    </div>
  </div>

  <script>
    (function () {
      const ROLE_COPY = {
        ADMIN: {
          badge: 'Admin invite',
          title: 'Create an Administrator account',
          description: 'Admins can manage users, courses, sections, and system settings.',
          display: 'Admin Staff'
        },
        PROFESSOR: {
          badge: 'Professor invite',
          title: 'Create a Professor account',
          description: 'Professors manage their assigned sections and run attendance sessions.',
          display: 'Professor'
        },
        TEACHING_ASSISTANT: {
          badge: 'Teaching Assistant invite',
          title: 'Create a Teaching Assistant account',
          description: 'Teaching Assistants support live sessions and review low-confidence scans.',
          display: 'Teaching Assistant'
        }
      };

      const params = new URLSearchParams(window.location.search);
      const roleParam = (params.get('role') || '').trim().toUpperCase();
      const lockedRole = ROLE_COPY[roleParam] ? roleParam : null;

      const elements = {
        roleBadge: document.getElementById('roleBadge'),
        pageTitle: document.getElementById('pageTitle'),
        pageDescription: document.getElementById('pageDescription'),
        roleDisplay: document.getElementById('roleDisplay'),
        alertBox: document.getElementById('alert'),
        alertIcon: document.getElementById('alertIcon'),
        alertText: document.getElementById('alertText'),
        submitBtn: document.getElementById('submitBtn'),
        btnText: document.getElementById('btnText'),
        btnArrow: document.getElementById('btnArrow'),
        btnSpinner: document.getElementById('btnSpinner'),
        togglePassword: document.getElementById('togglePassword'),
        passwordInput: document.getElementById('password'),
        eyeIcon: document.getElementById('eyeIcon')
      };

      const inputs = {
        fullname: document.getElementById('fullname'),
        username: document.getElementById('userid'),
        email: document.getElementById('email'),
        password: document.getElementById('password'),
        inviteCode: document.getElementById('inviteCode')
      };

      const errors = {
        fullname: document.getElementById('fullname-error'),
        username: document.getElementById('userid-error'),
        email: document.getElementById('email-error'),
        password: document.getElementById('password-error'),
        inviteCode: document.getElementById('inviteCode-error')
      };

      function setAlert(message, type = 'error') {
        const styles = {
          error: 'mb-6 p-4 rounded-xl border animate-fade-in bg-red-50 border-red-200 text-red-700',
          info: 'mb-6 p-4 rounded-xl border animate-fade-in bg-blue-50 border-blue-200 text-blue-700',
          success: 'mb-6 p-4 rounded-xl border animate-fade-in bg-green-50 border-green-200 text-green-700'
        };
        elements.alertText.textContent = message;
        elements.alertIcon.innerHTML = type === 'success'
          ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />'
          : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.062 19h13.876c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />';
        elements.alertBox.className = styles[type] || styles.error;
        elements.alertBox.classList.remove('hidden');
      }

      function hideAlert() {
        elements.alertBox.classList.add('hidden');
      }

      function showFieldError(input, errorEl, message) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
        input.classList.add('border-red-300', 'bg-red-50');
      }

      function clearFieldError(input, errorEl) {
        errorEl.classList.add('hidden');
        input.classList.remove('border-red-300', 'bg-red-50');
      }

      if (!lockedRole) {
        setAlert('Invalid or missing invite link. Please use the invite link sent to you.');
        Object.values(inputs).forEach(el => el.disabled = true);
        elements.submitBtn.disabled = true;
        return;
      }

      const copy = ROLE_COPY[lockedRole];
      elements.roleBadge.textContent = copy.badge;
      elements.pageTitle.textContent = copy.title;
      elements.pageDescription.textContent = copy.description;
      elements.roleDisplay.textContent = copy.display;

      let passwordVisible = false;
      elements.togglePassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        elements.passwordInput.type = passwordVisible ? 'text' : 'password';
        elements.eyeIcon.innerHTML = passwordVisible
          ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268-2.943 9.543-7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />'
          : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
      });

      function setLoading(loading) {
        elements.submitBtn.disabled = loading;
        Object.values(inputs).forEach(el => el.disabled = loading);
        if (loading) {
          elements.btnText.textContent = 'Creating account…';
          elements.btnArrow.classList.add('hidden');
          elements.btnSpinner.classList.remove('hidden');
        } else {
          elements.btnText.textContent = 'Create account';
          elements.btnArrow.classList.remove('hidden');
          elements.btnSpinner.classList.add('hidden');
        }
      }

      function validate() {
        hideAlert();
        let valid = true;

        const fullName = inputs.fullname.value.trim();
        if (!fullName) {
          showFieldError(inputs.fullname, errors.fullname, 'Full name is required');
          valid = false;
        } else {
          clearFieldError(inputs.fullname, errors.fullname);
        }

        const username = inputs.username.value.trim();
        if (!username) {
          showFieldError(inputs.username, errors.username, 'Username is required');
          valid = false;
        } else {
          clearFieldError(inputs.username, errors.username);
        }

        const emailValue = inputs.email.value.trim();
        if (!emailValue) {
          showFieldError(inputs.email, errors.email, 'Email is required');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
          showFieldError(inputs.email, errors.email, 'Enter a valid email address');
          valid = false;
        } else {
          clearFieldError(inputs.email, errors.email);
        }

        if (!inputs.password.value || inputs.password.value.length < 8) {
          showFieldError(inputs.password, errors.password, 'Password must be at least 8 characters');
          valid = false;
        } else {
          clearFieldError(inputs.password, errors.password);
        }

        if (!inputs.inviteCode.value.trim()) {
          showFieldError(inputs.inviteCode, errors.inviteCode, 'Invite code is required');
          valid = false;
        } else {
          clearFieldError(inputs.inviteCode, errors.inviteCode);
        }

        return valid;
      }

      document.getElementById('signupForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!validate()) {
          setAlert('Please correct the highlighted fields.');
          return;
        }

        setLoading(true);
        try {
          const payload = {
            username: inputs.username.value.trim(),
            password: inputs.password.value,
            email: inputs.email.value.trim(),
            fullName: inputs.fullname.value.trim(),
            role: lockedRole,
            inviteCode: inputs.inviteCode.value.trim()
          };

          const response = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json().catch(() => null);
          if (!response.ok || !result?.success) {
            throw new Error(result?.message || 'Signup failed');
          }

          setAlert('Account created successfully! Redirecting to sign in…', 'success');
          document.getElementById('signupForm').reset();
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        } catch (error) {
          setAlert(error.message || 'Unable to create account.');
        } finally {
          setLoading(false);
        }
      });
    })();
  </script>
</body>

</html>
